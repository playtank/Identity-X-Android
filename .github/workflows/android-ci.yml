name: Android CI Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  verify_pull_request:
    name: Run Engineering Excellence Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Gate 1 - Static Code Analysis & Code Style Check
        run: ./gradlew lintDebug --no-daemon

      - name: Gate 2 - Execute Local Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Gate 3 - Cold Boot Compilation & Assemble Check
        run: ./gradlew assembleDebug --no-daemon