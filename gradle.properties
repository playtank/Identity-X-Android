# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory to 4GB to handle KSP and Hilt processing better.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Disable VFS watching on Windows to prevent file locking issues
org.gradle.vfs.watch=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# ==============================================================================
# TECHNICAL DEBT GATEKEEPER: KOTLIN/AGP SOURCE-SET COMPATIBILITY FLAG
# ==============================================================================
# TODO: (Ref: Identity-X-Android Technical Debt Ticket)
# WHY: Temporary backward compatibility flag injected to unblock Gradle 8.x/AGP 8.x sync pipelines.
# IMPACT: Leaving this as 'false' bypasses modern compiler safety checks.
android.disallowKotlinSourceSets=false
